name: Nuri
options:
  bundleIdPrefix: app.nuri
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: Y35975BXD4
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    DEAD_CODE_STRIPPING: YES
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_COMPILATION_MODE: wholemodule
  configs:
    Debug:
      SWIFT_COMPILATION_MODE: incremental
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      STRIP_INSTALLED_PRODUCT: YES
      DEPLOYMENT_POSTPROCESSING: YES
targets:
  Nuri:
    type: application
    platform: macOS
    sources:
      - path: Nuri
        excludes:
          - Resources/Scripts
      - path: Nuri/Resources/Scripts
        type: folder
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nuri.browser
        PRODUCT_NAME: Nuri
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Nuri.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Copy injected scripts
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}"/Nuri/Resources/Scripts/*.js "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
