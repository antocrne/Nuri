# Nuri's self-tests at each pull request and each push to main, on a Mac runner (it has a window
# server, which the tests need: they drive the real window). Not on every branch push: a branch
# with an open pull request would run twice.
name: Auto-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  selftest:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Auto-tests
        env:
          NURI_SELFTEST_ADHOC: "1"
        run: scripts/selftest.sh "" "$RUNNER_TEMP/rapport.md"
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rapport-auto-tests
          path: ${{ runner.temp }}/rapport*
